trigger:
  - master
  - release/*

variables:
  ArticleFull: 8866027201
  ProjectID: MapStreamer
  Major: 5
  Minor: 0
  NuGetConfig: S3C_project.config

# Build number format
name: $(ArticleFull).$(Major).$(Minor).$(rev:r)

resources:
  repositories:
    - repository: release_templates
      type: git
      name: release_templates
      project: Common
      ref: refs/tags/2.2.9

stages:
  - stage: Checkout
    jobs:
      - job: Checkout
        workspace:
          clean: all

        pool:
          name: TS-Windows
          demands:
            - SEP_ENV_TS_DEV_BUILD

        steps:
          - checkout: self
            lfs: true
            clean: true
            persistCredentials: true

          - task: set-version-variables@1
            displayName: Set version variables according to BuildNumber
            inputs:
              setProductVersionVariable: true
              setMajorVariable: true
              setMinorVariable: true
              setBuildVariable: true
              setRevisionVariable: true
              failOnVersionSyntax: true
              defineCustomizedVariable: false

          - task: PublishBuildArtifacts@1
            displayName: Publish Wiki Artifact
            inputs:
              PathtoPublish: CHANGELOG.md
              ArtifactName: wiki

          - task: SaabUseDotNet@1
            inputs:
              packageType: sdk
              version: 10.0.x
              serviceConnection: TSArtifactory

          - task: NuGetAuthenticate@1
            inputs:
              nuGetServiceConnections: S3C-nuget.org

          - task: DownloadSecureFile@1
            name: NuGetFeeds
            inputs:
              secureFile: '$(NuGetConfig)'

          - task: DotNetCoreCLI@2
            displayName: Restore camera tests
            inputs:
              command: restore
              projects: vs17\Saab.Foundation.Unity.MapStreamer.Camera.Test\Saab.Foundation.Unity.MapStreamer.Camera.Test.csproj
              feedsToUse: config
              nugetConfigPath: '$(NuGetFeeds.secureFilePath)'
              externalFeedCredentials: S3C-nuget.org

          - task: DotNetCoreCLI@2
            displayName: Run camera tests
            continueOnError: true
            inputs:
              command: test
              projects: vs17\Saab.Foundation.Unity.MapStreamer.Camera.Test\Saab.Foundation.Unity.MapStreamer.Camera.Test.csproj
              arguments: '-c Release --no-restore'
              publishTestResults: true
              testRunTitle: MapStreamer camera

  - ${{ if or(eq(variables['Build.SourceBranch'], 'refs/heads/master'), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/')) }}:
      - stage: PublishWiki
        displayName: Publish to Wiki, tag and retain
        dependsOn: Checkout
        jobs:
          - template: update_wiki.yml@release_templates
            parameters:
              article: $(ArticleFull)
              project: Common
              wiki: Common
              page: 1479
              changelogpath: wiki/CHANGELOG.md
              publishEnvironment: PublishEnvironment
